name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install test tools on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bats-core coreutils jq
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install test tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats jq

      - name: Check formatting
        run: zig fmt --check src/

      - name: Check compilation
        run: zig build check

      - name: Run unit tests
        run: zig build test --summary all

      - name: Build executable
        run: zig build

      - name: Run behavioral tests
        run: bats --jobs 1 test/*.bats
